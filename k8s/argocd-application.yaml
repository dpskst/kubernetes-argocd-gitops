apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-devops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dydcjsrjaror/my-k8s-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true